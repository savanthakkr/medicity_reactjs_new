<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800;900&display=swap"
			rel="stylesheet"
		/>
		<title>Medicity</title>
		<script>
			try {
				var themeDataStr = localStorage.getItem('theme');
				var theme = 'light'; // Default theme
				if (themeDataStr) {
					var parsed = JSON.parse(themeDataStr);
					if (parsed && parsed.value && parsed.expiration > new Date().getTime()) {
						theme = parsed.value;
					}
				}
				if (theme === 'dark') {
					document.documentElement.classList.add('dark');
					document.documentElement.classList.remove('light');
				} else {
					document.documentElement.classList.add('light');
					document.documentElement.classList.remove('dark');
				}
			} catch (e) {}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
